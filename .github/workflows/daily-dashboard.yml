name: USD/JPY daily dashboard

on:
  schedule:
    - cron: "35 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: penpen0317/penpen0317
          ref: claude/minano-fx-auto-trading-h4rb6d
          path: .fxbot-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ./.fxbot-src

      - name: download stooq
        id: stooq
        continue-on-error: true
        working-directory: .fxbot-src
        run: |
          mkdir -p data
          curl -fsS --max-time 60 -A "Mozilla/5.0 (compatible; fxbot/1.0)" "https://stooq.com/q/d/l/?s=usdjpy&i=d" -o stooq.csv
          head -2 stooq.csv

      - name: validate and convert
        id: convert
        if: steps.stooq.outcome == 'success'
        continue-on-error: true
        working-directory: .fxbot-src
        shell: python
        run: |
          import csv, sys

          rows = []
          with open("stooq.csv", newline="", encoding="utf-8") as fh:
              for r in csv.DictReader(fh):
                  low = {(k or "").strip().lower(): v for k, v in r.items()}
                  try:
                      d = low["date"].strip()
                      c = float(low["close"])
                      o = float(low.get("open") or c)
                      h = float(low.get("high") or c)
                      l = float(low.get("low") or c)
                  except (KeyError, TypeError, ValueError, AttributeError):
                      continue
                  if not (20.0 <= c <= 1000.0):
                      sys.exit(f"implausible USD/JPY value: {c}")
                  if h < max(o, c) or l > min(o, c):
                      sys.exit(f"inconsistent OHLC on {d}")
                  rows.append((d, o, h, l, c))

          if len(rows) < 220:
              sys.exit(f"too few rows: {len(rows)}")
          rows.sort()
          if len({r[0] for r in rows}) != len(rows):
              sys.exit("duplicate dates")

          with open("data/usdjpy_daily.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.writer(fh)
              w.writerow(["date", "open", "high", "low", "close"])
              w.writerows(rows)
          print(f"stooq: {len(rows)} rows, latest {rows[-1][0]}, close {rows[-1][4]}")

      - name: fallback source
        if: steps.convert.outcome != 'success'
        working-directory: .fxbot-src
        run: |
          echo "::warning::Stooq unavailable, using fallback"
          fxbot fetch --out data/usdjpy_daily.csv

      - name: build dashboard
        working-directory: .fxbot-src
        run: |
          fxbot dashboard --data data/usdjpy_daily.csv --out "$GITHUB_WORKSPACE/fx/index.html"

      - name: summary
        id: summary
        working-directory: .fxbot-src
        run: |
          line="$(fxbot monitor --data data/usdjpy_daily.csv --oneline)"
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"

      - name: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx/index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update USD/JPY dashboard ($(date -u '+%Y-%m-%d'))"
            git push
          fi

      - name: notify
        if: ${{ env.NTFY_TOPIC != '' }}
        env:
          SUMMARY: ${{ steps.summary.outputs.line }}
        run: |
          curl -fsS -H "Title: USD/JPY signals" -H "Click: https://penpen0317.github.io/fx/" -d "$SUMMARY" "https://ntfy.sh/${NTFY_TOPIC}"
